# WEGWERP-PROBE — hoort NIET op main te belanden.
#
# Waarom hij bestaat: de `verify`-job in publish.yml is tien runs lang overgeslagen terwijl
# `build` en `deploy` in diezelfde runs slaagden. De hypothese is dat een overgeslagen
# `failure-page` transitief doorwerkt: `deploy` overleeft dat met !cancelled(), maar `verify`
# heeft een kale `if` zonder statusfunctie en erft daardoor alsnog de skip.
#
# publish.yml zelf kan die hypothese hier niet toetsen: het environment `github-pages` staat
# alleen deploys vanaf `main` toe (gemeten), dus een dispatch op een branch zou stranden op de
# environmentpoort en niets over de skip bewijzen. Deze probe kopieert daarom exact dezelfde
# jobgrafiek — build → (overgeslagen) failure-page → deploy met !cancelled() → verify — maar
# zonder Pages, zonder deploy en zonder publicatie. Beide varianten van de verify-voorwaarde
# draaien náást elkaar in één run, zodat oud en nieuw onder identieke omstandigheden meten.
name: verify-skip-probe

# Push-trigger op de probe-branch zelf: workflow_dispatch kan hier niet, want GitHub accepteert
# dat alleen voor workflows die al op de default branch staan (gemeten: HTTP 404 "not found on the
# default branch"). Het scenario wordt daarom gestuurd via het bestand `probe-stempel.txt`.
on:
  push:
    branches: [fix/verify-skip]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      stamp: ${{ steps.stamp.outputs.value }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - id: stamp
        shell: bash
        run: |
          set -euo pipefail
          FOUT=$(cat probe-stempel.txt 2>/dev/null || echo geldig)
          if [ "$FOUT" = "fout" ]; then
            # Zelfde vorm als een echte stempel, maar een onmogelijke datum: dit is precies wat de
            # parse-plus-roundtrip in publish.yml hoort af te vangen.
            echo "value=2026-02-31T25:99:99.999Z" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(node -e 'process.stdout.write(new Date().toISOString())')" >> "$GITHUB_OUTPUT"
          fi

  # Spiegelt publish.yml: draait alleen bij een gefaalde build, dus in een geslaagde run overgeslagen.
  failure-page:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "niet bereikt in een geslaagde run"

  # Spiegelt publish.yml: overleeft de overgeslagen failure-page dankzij !cancelled().
  deploy:
    needs: [build, failure-page]
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.failure-page.result == 'success') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "deploy-plaatsvervanger — publiceert niets"

  # ARM A — de voorwaarde zoals hij nu in publish.yml staat. Verwachting: SKIPPED.
  verify-kaal:
    needs: [build, deploy]
    if: needs.build.result == 'success' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "ARM A draaide — dan is de hypothese onjuist."

  # ARM B — dezelfde voorwaarde met !cancelled() ervoor. Verwachting: DRAAIT, en wordt ROOD bij
  # een ongeldige stempel. De stap hieronder is letterlijk de poort uit publish.yml.
  verify-met-cancelled:
    needs: [build, deploy]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Gepubliceerd artefact draagt de gebouwde stempel (geen live-URL, geen CDN)
        shell: bash
        env:
          GEBOUWD: ${{ needs.build.outputs.stamp }}
        run: |
          set -uo pipefail
          node -e '
            const s = process.env.GEBOUWD || "";
            const d = new Date(s);
            if (Number.isNaN(d.getTime()) || d.toISOString() !== s) {
              console.error(`::error::gebouwde stempel is geen geldige canonieke ISO-8601-UTC ("${s || "<leeg>"}") — publicatie niet te verifiëren.`);
              process.exit(1);
            }
          '
          echo "✓ deploy geslaagd; gepubliceerd artefact draagt stempel $GEBOUWD"
