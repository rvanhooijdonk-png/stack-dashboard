name: publish

# Drie triggers. Push naar main en workflow_dispatch heb je zelf in de hand; de schedule is de
# klok voor een systeem dat niet continu pusht (anders is de plaat zo oud als de laatste push,
# terwijl de browser wél elke 15 min herlaadt — dat start geen build).
#
# Twee VASTE momenten i.p.v. de oude '*/15'-cron. Die kwartiercron vuurde hier gedocumenteerd
# niet: gemeten op 2026-07-23 gingen drie opeenvolgende slots leeg voorbij (nul runs met
# event=schedule). GitHub documenteert dat geplande runs vertraagd/gedropt worden en
# deprioriteert hoogfrequente crons in de praktijk sterker; twee lage, vaste momenten zijn
# betrouwbaarder én maken elke schedule-run eenduidig toewijsbaar (het klok-bewijs). 05:45 UTC
# voor de ochtend, 15:45 UTC voor de avond. Geen publieke pagina belooft hierom een hard
# interval — een gedropte run blijft mogelijk — maar dit is de best haalbare klok zonder push.
on:
  schedule:
    - cron: '45 5 * * *'
    - cron: '45 15 * * *'
  push:
    branches: [main]
  workflow_dispatch:

# Standaard niets. Elke job krijgt hieronder precies wat hij nodig heeft.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # De zojuist gebouwde stempel, zodat de post-deploy zelftest kan bewijzen dat de origin
      # deze ook echt serveert. Leeg bij een gefaalde build (dan draait `verify` sowieso niet).
      stamp: ${{ steps.stamp.outputs.value }}
      # Welke stap faalde + de gemeten foutlocatie — voor de noodpagina (OPDRACHT/DE-PLAAT-
      # MELDT-MAAR-ZEGT-NIET-WAT). Job-outputs blijven leesbaar voor needs.build zelfs als de
      # job als geheel `failure` is, zolang de producerende stap zelf slaagde — zelfde patroon
      # als `stamp` hierboven, nu ook op de faalpad.
      failure_step: ${{ steps.faalinfo.outputs.step }}
      failure_detail: ${{ steps.faalinfo.outputs.detail }}
    steps:
      - id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - id: setup_node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'

      # Geen pad-argument. Een glob werkt hier niet: de aanhalingstekens hielden de shell ervan
      # af en node 20 vouwt een patroon in `--test` niet zelf uit (dat kan pas vanaf 21), dus
      # zocht de runner letterlijk naar een bestand `test/*.test.mjs`. Een map meegeven werkt op
      # 20 wél, maar laat node 24 crashen ("Cannot find module") omdat die een map als te draaien
      # module leest — gemeten op 20.19.0 en 24.14.1; ertussenin niet nagemeten. Een expliciete
      # bestandslijst zou op beide werken, maar slaat een later toegevoegde test stil over. Kaal
      # `node --test` doet de ontdekking zelf.
      #
      # Maar kaal `node --test` heeft één stille faalwijze (SLOTREGEL-bevinding B-1, megabatch
      # 24-07, gemeten op node 24.14.1): een map zónder testbestanden geeft `# tests 0` en exit 0
      # — groen. Verplaatst of hernoemt iemand ooit de tests zodat de ontdekking niets vindt, dan
      # blijft deze stap groen en publiceert de build alsnog. De poort die de andere poorten
      # bewaakt zou zelf onzichtbaar leeglopen. Daarom een ondergrens: valt de ontdekte telling
      # onder de vloer, dan faalt de stap fail-closed. De vloer is een instortdetector, geen
      # exact-aantal-eis — hij staat ruim onder het echte aantal (117 op 24-07) zodat normaal
      # snoeien niet vals alarmeert, maar een leeggelopen ontdekking wél.
      - name: Tests
        id: tests
        env:
          TESTS_ONDERGRENS: "50"
        run: |
          set -euo pipefail
          node --test --test-reporter=tap 2>&1 | tee /tmp/tests.tap
          # pipefail hierboven laat een echte testfout (node exit != 0) de stap al rood maken.
          total="$(grep -E '^# tests [0-9]+' /tmp/tests.tap | tail -1 | grep -oE '[0-9]+' || echo 0)"
          echo "Ontdekte tests: ${total} (ondergrens ${TESTS_ONDERGRENS})"
          if [ "${total:-0}" -lt "${TESTS_ONDERGRENS}" ]; then
            echo "::error title=Testontdekking leeggelopen::${total} tests < ondergrens ${TESTS_ONDERGRENS}. Kaal node --test geeft exit 0 bij nul tests; deze poort maakt dat fail-closed." >&2
            exit 1
          fi

      # Poort 3 komt van buiten onze eigen regexen. Vaste versie, geverifieerde checksum:
      # een secretsscanner die je niet kunt vertrouwen, is geen poort.
      - name: gitleaks installeren (gepind + checksum)
        id: gitleaks_install
        run: |
          set -euo pipefail
          curl -sSL --fail -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # Bewijs dat poort 3 écht dichtgaat. Faalt deze stap niet, dan is de scan een placebo.
      - name: Zelftest — een nepsecret MOET de scan laten falen
        id: gitleaks_selftest
        run: |
          set -euo pipefail
          mkdir -p /tmp/gate-selftest
          # Het nepsecret moet er ook vóór de scanner als een secret uitzien. `ghp_` gevolgd door
          # 36× dezelfde letter haalt de entropiedrempel van de github-pat-regel niet: gemeten op
          # gitleaks 8.30.1 wordt zo'n token NIET gevonden, en dan meldt deze zelftest ten
          # onrechte dat de poort stuk is. Een bekend voorbeeldsecret werkt om dezelfde reden
          # niet — de AWS-documentatiesleutel staat op de allowlist van gitleaks zelf, gemeten.
          # Dus een verse willekeurige waarde per run; die staat ook nergens in de repo.
          # Apart genereren, want een mislukte openssl binnen $(...) wordt door de printf
          # eromheen gemaskeerd en zou hier als "poort stuk" uitkomen.
          achtervoegsel="$(openssl rand -hex 18)" || true
          [ ${#achtervoegsel} -eq 36 ] || { echo "::error::kon geen nepsecret genereren (openssl) — er wordt niet gepubliceerd."; exit 1; }
          printf 'token: ghp_%s\n' "$achtervoegsel" > /tmp/gate-selftest/leak.txt
          # Eigen exitcode, want gitleaks gebruikt 1 zowel voor "gevonden" als voor een
          # scannerfout (gemeten: ontbrekende map en onleesbare config geven allebei 1). Met de
          # standaardcode zou een kapotte scanner hier als geslaagde zelftest doorgaan — precies
          # het fail-open dat deze stap moet uitsluiten. Nu telt alleen 42 als "gevonden".
          set +e
          ./gitleaks dir /tmp/gate-selftest --redact --exit-code 42 --no-banner
          code=$?
          set -e
          if [ "$code" -ne 42 ]; then
            echo "::error::zelftest mislukt (gitleaks exit $code; 42 = nepsecret gevonden, 0 = niet gevonden, anders scannerfout) — er wordt niet gepubliceerd."
            exit 1
          fi
          echo "zelftest ok: gitleaks faalt op een geplant nepsecret"
          rm -rf /tmp/gate-selftest

      - name: Genereren (read-only aggregatie)
        id: genereren
        env:
          # Zonder dit token vallen de org-brede PR-secties terug op SOURCE_UNAVAILABLE.
          # De pagina toont dat zichtbaar; er wordt nooit een oude groene stand hergebruikt.
          GH_TOKEN: ${{ secrets.ORG_PR_READ_TOKEN || github.token }}
        run: node scripts/build.mjs

      - name: Alleen toegestane bestanden in de publicatiemap
        id: allowed_files
        run: |
          set -euo pipefail
          onverwacht=$(find public -mindepth 1 \
            ! -name 'index.html' ! -name 'status.json' ! -name '.nojekyll' -printf '%P\n')
          if [ -n "$onverwacht" ]; then
            echo "::error::onverwachte bestanden in public: $onverwacht"
            exit 1
          fi

      - name: gitleaks op de output
        id: gitleaks_output
        run: ./gitleaks dir public --redact --exit-code 1 --no-banner

      - name: Stempel als job-output (voor de post-deploy zelftest)
        id: stamp
        run: echo "value=$(node -p "require('./public/status.json').generatedAt")" >> "$GITHUB_OUTPUT"

      - name: Samenvatting
        id: samenvatting
        run: |
          {
            echo '### stack-dashboard'
            echo ''
            echo "status: $(node -p "require('./public/status.json').overallStatus")"
            echo ''
            node -p "require('./public/status.json').sources.map(s=>'- '+s.key+': '+s.trust).join('\n')"
          } >> "$GITHUB_STEP_SUMMARY"

      - id: upload_artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public

      # OPDRACHT/DE-PLAAT-MELDT-MAAR-ZEGT-NIET-WAT (2026-07-28): de noodpagina somde eerst drie
      # mogelijke oorzaken op ("een test, de sanitize-gate of de secretsscan") terwijl de CI altijd
      # al weet welke stap het was — `steps.<id>.outcome` meet het, hier wordt niets geraden. Bij
      # Tests wordt ook de gemeten TAP-locatie (bestand:regel) meegegeven; bij de overige stappen
      # is er geen vergelijkbare gestructureerde locatie, dus alleen de stapnaam + een eerlijke
      # verwijzing naar de CI-log (geen verzonnen bestand/regel).
      #
      # Deze stap staat bewust ALS LAATSTE: stond hij eerder (vóór Samenvatting/upload), dan had
      # `if: failure()` op dát moment nog niets om te melden zolang alle stappen ervoor slaagden —
      # faalde een stap DAARNA (Samenvatting, upload-pages-artifact), dan was faalinfo dus al als
      # `skipped` afgesloten en kreeg de downstream job lege outputs (Codex-review 28-07-2026).
      # Nu vangt `if: failure()` hier een fout in ÉÉN van alle voorgaande stappen, inclusief de
      # laatste twee.
      #
      # Restbeperking, bewust niet opgelost (Codex-review v2, 28-07-2026 — laag): een POST-actie
      # (de opruimstap die `actions/checkout`/`actions/setup-node` zelf na afloop van de hele job
      # draait) loopt ná déze stap. Faalt zo'n post-actie, dan was `failure()` hier nog niets en
      # slaat deze stap dus zelf over — de noodpagina krijgt dan lege `step`/`detail`-outputs en valt
      # terug op de generieke tekst die al in `failure-page.mjs` zit, niet op een specifieke melding.
      # Dat degradeert veilig (nooit een oude/foute stand), maar noemt de post-actie niet met naam.
      - name: Faalinfo vastleggen (voor de noodpagina — de gemeten stap, geen drie mogelijkheden)
        id: faalinfo
        if: failure()
        run: |
          set -uo pipefail
          stap="onbekende stap"
          detail="geen van de gemeten stappen faalde expliciet — mogelijk een post-job- of infrastructuurfout; zie de volledige CI-log van deze run"
          if [ "${{ steps.checkout.outcome }}" = "failure" ]; then
            stap="checkout"
            detail="git checkout van deze commit is mislukt — zie de CI-log van deze stap"
          elif [ "${{ steps.setup_node.outcome }}" = "failure" ]; then
            stap="setup-node"
            detail="node-installatie via actions/setup-node is mislukt — zie de CI-log van deze stap"
          elif [ "${{ steps.tests.outcome }}" = "failure" ]; then
            stap="Tests"
            # Eerst het blok van de EERSTE 'not ok' isoleren (tot de volgende 'not ok'), zodat een
            # 'location:' uit een LATERE falende test nooit aan de EERSTE genoemde testnaam wordt
            # geplakt (Codex-review 28-07-2026: de twee greps liepen eerder onafhankelijk over het
            # hele bestand). Anker op exact twee spaties + aanhalingsteken: dat is de insprong van
            # het echte gestructureerde TAP-veld, niet van tekst die toevallig in een geneste
            # `error: |-`-blok staat (die springt verder in).
            # grep -oE + tr i.p.v. \s-sed: \s is geen POSIX-BRE/ERE-klasse en niet overal
            # gegarandeerd (lokaal op macOS/BSD-sed faalde dit stil) — hier lokaal getoetst tegen
            # een echte gevangen TAP-regel (test/spiegelwet.test.mjs:138) vóórdat dit naar CI ging.
            # `|| true` op elke extractie: GitHub's runner-shell heeft `-e` al aan (los van de
            # `set -uo pipefail` hierboven, die schakelt `-e` niet uit) — zonder `|| true` breekt
            # een lege match (geen 'not ok'/'location:' gevonden) deze stap af vóór de fallback
            # hieronder wordt bereikt (Codex-review 28-07-2026).
            # Insprong van de EERSTE 'not ok' expliciet meten i.p.v. aan te nemen dat hij bij kolom
            # 0 begint (Codex-review v2, 28-07-2026): een genest subtest-kind (`t.test()`/
            # `describe()`) hangt dieper in en verscheen anders onder de naam/locatie van zijn
            # OUDER-test, niet zichzelf — reproduceerbaar met `node --test-reporter=tap`. Het
            # `location:`-anker (insprong+2, `grep -m1`) blijft daardoor exact op het kind geplakt,
            # ook als de blok-afkap (bij een niet-geneste vervolgtest op dezelfde insprong) niet in
            # elk denkbaar geval de allerlaatste regel raakt — de EERSTE match is en blijft de juiste.
            eerste_ln="$(grep -nE '^[[:space:]]*not ok ' /tmp/tests.tap 2>/dev/null | head -1 | cut -d: -f1 || true)"
            inspring="$(sed -n "${eerste_ln:-0}p" /tmp/tests.tap 2>/dev/null | sed -E 's/^([[:space:]]*)not ok.*/\1/' || true)"
            blok="$(awk -v start="${eerste_ln:-0}" -v ind="$inspring" 'NR==start{found=1} found{ if(NR>start && $0 ~ "^"ind"not ok ") exit; print }' /tmp/tests.tap 2>/dev/null || true)"
            naam="$(printf '%s\n' "$blok" | head -1 | sed -E 's/^[[:space:]]*not ok [0-9]+ - //' || true)"
            regel="$(printf '%s\n' "$blok" | grep -m1 -E "^${inspring}  location: '" | grep -oE "'[^']+'" | tr -d "'" | sed -E 's#^/home/runner/work/[^/]+/[^/]+/##' || true)"
            if [ -n "$regel" ]; then
              detail="${naam:-testfout} (${regel})"
            else
              detail="${naam:-testfout} — zie de CI-log van de Tests-stap voor de exacte regel"
            fi
          elif [ "${{ steps.gitleaks_install.outcome }}" = "failure" ]; then
            stap="gitleaks installeren"
            # Neutraal i.p.v. specifiek "checksum kwam niet overeen": de stap heeft drie andere
            # faalpunten (download, uitpakken, versie-check) die evengoed de oorzaak kunnen zijn
            # (Codex-review v2, 28-07-2026) — het gemeten `outcome` bewijst alleen dát de stap
            # faalde, niet welke van de vier commando's.
            detail="installatie van gitleaks v${GITLEAKS_VERSION} is niet gelukt (download, checksum, uitpakken of versie-check) — zie de CI-log van deze stap"
          elif [ "${{ steps.gitleaks_selftest.outcome }}" = "failure" ]; then
            stap="gitleaks-zelftest"
            detail="de scanner vond het geplante nepsecret niet (of gaf zelf een fout) — de secretsscan is dan niet te vertrouwen"
          elif [ "${{ steps.genereren.outcome }}" = "failure" ]; then
            stap="Genereren"
            detail="node scripts/build.mjs gaf een fout — zie de CI-log van de Genereren-stap"
          elif [ "${{ steps.allowed_files.outcome }}" = "failure" ]; then
            stap="Alleen toegestane bestanden"
            detail="onverwachte bestanden in public/ — zie de CI-log van deze stap"
          elif [ "${{ steps.gitleaks_output.outcome }}" = "failure" ]; then
            stap="gitleaks op de output"
            # Neutraal i.p.v. "sloeg aan": gitleaks geeft exitcode 1 zowel bij een gevonden secret
            # als bij een scannerfout (zelfde ambiguïteit als bij de zelftest hierboven, gemeten —
            # Codex-review v2, 28-07-2026). Het gemeten `outcome` bewijst alleen dát de stap faalde.
            detail="de secretsscan op de gegenereerde public/-map is niet succesvol afgerond (trof mogelijk iets aan, of de scanner faalde zelf) — zie de CI-log van deze stap"
          elif [ "${{ steps.stamp.outcome }}" = "failure" ]; then
            stap="Stempel als job-output"
            detail="kon generatedAt niet uit public/status.json lezen — zie de CI-log van deze stap"
          elif [ "${{ steps.samenvatting.outcome }}" = "failure" ]; then
            stap="Samenvatting"
            detail="het schrijven van de GITHUB_STEP_SUMMARY is mislukt — zie de CI-log van deze stap"
          elif [ "${{ steps.upload_artifact.outcome }}" = "failure" ]; then
            stap="upload-pages-artifact"
            detail="het uploaden van het Pages-artefact is mislukt — zie de CI-log van deze stap"
          fi
          # `detail` is door de bovenstaande constructie altijd één regel (eigen tekst + hooguit een
          # testnaam/bestandspad); de newline→spatie-vervanging maakt dat ook aantoonbaar zo, waarna
          # de simpele `key=value`-vorm van GITHUB_OUTPUT volstaat — geen heredoc-afsluiter meer
          # nodig die (in theorie) door de waarde zelf getroffen kan worden (Codex-review 28-07-2026:
          # een `detail` die toevallig de losse regel `FAALINFO_EOF` bevat, zou de oude heredoc-vorm
          # vroegtijdig afsluiten).
          detail_eenregelig="$(printf '%s' "${detail:0:300}" | tr '\n' ' ')"
          {
            echo "step=${stap}"
            echo "detail=${detail_eenregelig}"
          } >> "$GITHUB_OUTPUT"

  # Faalt de build, dan publiceren we een datavrije foutpagina. Dat is opzettelijk:
  # GitHub Pages haalt een oude versie niet weg, en een stilstaande groene pagina is
  # gevaarlijker dan een pagina die zegt dat ze niets weet.
  failure-page:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      # Checkout heeft leesrechten nodig. De foutpagina komt nu uit één getest bestand
      # (scripts/failure-page.mjs) i.p.v. een ongeteste heredoc, zodat wat we tonen exact is wat de
      # test bewaakt. Kosten: deze job hangt nu ook aan checkout+node — bewust geaccepteerd, want de
      # generator is puur en zonder deps, en single-sourcing weegt zwaarder dan die kleine extra stap.
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
      - name: Foutpagina genereren (geen enkele brondata, uit één getest bestand)
        env:
          # De gemeten stap + foutlocatie uit de build-job (leeg = de oude, eerlijke generieke
          # tekst blijft de fallback in failure-page.mjs — zie oorzaakTekst()).
          FAILURE_STEP: ${{ needs.build.outputs.failure_step }}
          FAILURE_DETAIL: ${{ needs.build.outputs.failure_detail }}
        run: |
          set -euo pipefail
          mkdir -p public
          : > public/.nojekyll
          node scripts/failure-page.mjs > public/index.html
          # Fail-closed sanity: wat we net schreven MOET de bedoelde noodpagina zijn (marker aanwezig),
          # anders publiceren we liever niets dan een lege/kapotte foutpagina.
          test "$(node scripts/failure-page.mjs --classify < public/index.html)" = "noodpagina"

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public

  deploy:
    needs: [build, failure-page]
    # !cancelled() i.p.v. always(): bij cancel-in-progress (group: pages) mag een ingehaalde,
    # geannuleerde run NIET alsnog publiceren en zo een nieuwere deploy inhalen. always() zou dat
    # wél doen (het negeert annulering); !cancelled() laat de annulering echt stoppen en dicht die
    # race. (Codex-review 24-07-2026.)
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.failure-page.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      # De echte, dynamische Pages-URL (geen hardcoded host) — de zachte live-check hangt hieraan,
      # zodat een fork of custom domain niet per ongeluk de upstream pollt. (Gemini-review 24-07.)
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # Gepusht is niet live — maar "live" toetsen we hier NIET via de publieke URL. Gemeten op
  # 2026-07-24: GitHub Pages/Fastly gebruikt de query-string niet als aparte cachesleutel
  # (status.json?cb=a en ?cb=b gaven dezelfde x-github-request-id en oplopende age), en ook
  # client-side no-cache-headers forceren geen verse read. Een live-URL-poll meet dus de
  # CDN-cache, niet de publicatie. Daarom is het publicatiebewijs: build geslaagd (artefact met
  # deze stempel) + deploy geslaagd (dat artefact atomisch gepubliceerd). Bouw dit NIET terug
  # naar een query-cachebuster-poll — die premisse is weerlegd.
  verify:
    needs: [build, deploy]
    # !cancelled() is hier geen sierlijkheid maar de reden dat deze job überhaupt draait. Zonder
    # die statusfunctie geldt de impliciete success()-poort, en die erft de skip van de
    # overgeslagen `failure-page` transitief via `deploy` — ook al slaagde deploy zelf. Gemeten
    # gevolg: tien opeenvolgende runs (2026-07-24 11:47 t/m 13:37) met build success + deploy
    # success en verify SKIPPED. De poort stond er wel, maar heeft nooit gedraaid. Bewezen in een
    # wegwerp-probe die dezelfde jobgrafiek nabouwde: beide varianten naast elkaar in één run
    # gaven kaal=SKIPPED en met-!cancelled()=SUCCESS.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Gepubliceerd artefact draagt de gebouwde stempel (geen live-URL, geen CDN)
        shell: bash
        env:
          GEBOUWD: ${{ needs.build.outputs.stamp }}
        run: |
          set -uo pipefail
          # Fail-closed: alleen een ECHTE canonieke ISO-8601-UTC-stempel mag slagen — niet slechts de
          # vorm. Een onmogelijke datum als 2026-02-31T25:99:99.999Z heeft de juiste vorm maar bestaat
          # niet; daarom een parse-plus-roundtrip: uitsluitend new Date(x).toISOString() === x slaagt.
          # Zo vallen "zzzz", "true", leeg én onmogelijke datums allemaal af (Codex-her-pass 24-07).
          node -e '
            const s = process.env.GEBOUWD || "";
            const d = new Date(s);
            if (Number.isNaN(d.getTime()) || d.toISOString() !== s) {
              console.error(`::error::gebouwde stempel is geen geldige canonieke ISO-8601-UTC ("${s || "<leeg>"}") — publicatie niet te verifiëren.`);
              process.exit(1);
            }
          '
          # De build maakte public/status.json met deze stempel en uploadde exact die map als
          # Pages-artefact; deploy publiceerde datzelfde artefact atomisch. Deploy geslaagd + deze
          # stempel in dat artefact ⇒ de gepubliceerde stand draagt stempel $GEBOUWD.
          echo "✓ deploy geslaagd; gepubliceerd artefact draagt stempel $GEBOUWD"

      - name: Zachte live-check — waarschuwt, faalt nooit (CDN cachet tot ~10 min)
        continue-on-error: true
        shell: bash
        env:
          GEBOUWD: ${{ needs.build.outputs.stamp }}
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -uo pipefail
          if [ -z "${BASE_URL:-}" ]; then
            echo "::warning::geen page_url van de deploy-job — live-check overgeslagen (publicatiebewijs blijft de deploy zelf)."
            exit 0
          fi
          # Eén poll, met tijdsbudget. --fail zodat een HTTP-fout niet stil als lege body doorgaat;
          # curl-stderr blijft zichtbaar in de log (geen 2>/dev/null — Gemini-review). Bewust géén
          # query-buster: die busts de CDN toch niet. BASE_URL zonder afsluitende slash aangevuld
          # (het action-outputcontract garandeert die niet — Codex-her-pass). Echte JSON-parse via
          # node zodat alleen het topniveau-veld telt, geen grep-false-match. Een oudere waarde is
          # GEEN fout — de CDN mag tot ~10 min lopen; deze stap waarschuwt hooguit, nooit rood.
          live=$(curl -fsS --connect-timeout 5 --max-time 15 "${BASE_URL%/}/status.json" \
            | node -pe 'try { JSON.parse(require("fs").readFileSync(0, "utf8")).generatedAt || "" } catch (e) { "" }') || live=""
          if [ "$live" = "$GEBOUWD" ]; then
            echo "live-URL toont al de nieuwe stempel ($live)."
          else
            echo "::warning::live-URL toont nog '${live:-<geen>}' i.p.v. '$GEBOUWD' — normaal: GitHub Pages/Fastly cachet tot ~10 min. Geen fout."
          fi

  # Het tweede structurele gat: de SUCCESS-route werd bewaakt (verify), de FAILURE-route niet. Als de
  # build faalt en de noodpagina wordt gepubliceerd, controleerde niets dat de live-URL daarna ook echt
  # de bedoelde noodpagina serveert — en niet de GitHub-Pages-404 (route stuk / nooit gepubliceerd). Deze
  # job dicht dat gat. Onderscheid t.o.v. de success-verify: een 404 op de Pages-root is GEEN CDN-artefact
  # van een eerdere goede stand — het betekent dat er niets gepubliceerd staat. Dat is een harde fout. Een
  # nog-gecachte oudere datastand is dat NIET (CDN-lag) → waarschuwing. De classificatie komt uit dezelfde
  # bron als de test (scripts/failure-page.mjs --classify), zodat CI en test niet kunnen divergeren.
  verify-failure:
    needs: [build, failure-page, deploy]
    if: ${{ !cancelled() && needs.build.result == 'failure' && needs.failure-page.result == 'success' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
      - name: Live-route serveert de noodpagina, niet de GitHub-404
        shell: bash
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -uo pipefail
          if [ -z "${BASE_URL:-}" ]; then
            echo "::warning::geen page_url van de deploy-job — live-route-check overgeslagen."
            exit 0
          fi
          # Meerdere pogingen met budget: vlak na de deploy kan de CDN nog een oudere stand serveren
          # (dat is 'anders' → geen fout). Maar een GitHub-404 op de root is de gat-toestand die we
          # hard afvangen. We pollen tot de noodpagina zichtbaar is, of tot het budget op is.
          gezien_404=0
          klasse="anders"
          for poging in 1 2 3 4 5 6; do
            body="$(curl -sS --connect-timeout 5 --max-time 15 "${BASE_URL%/}/" || true)"
            klasse="$(printf '%s' "$body" | node scripts/failure-page.mjs --classify)"
            echo "poging ${poging}: live-route classificeert als '${klasse}'"
            if [ "$klasse" = "noodpagina" ]; then
              echo "✓ de live-route serveert de bedoelde noodpagina."
              exit 0
            fi
            [ "$klasse" = "github-404" ] && gezien_404=1
            sleep 15
          done
          # Budget op. Zag de route in elke poging de GitHub-404, dan staat er niets gepubliceerd:
          # harde fout (precies het gat dat deze job dicht). Zag hij een oudere stand ('anders'), dan
          # is dat CDN-lag — waarschuwen, niet falen (consistent met de zachte success-live-check).
          if [ "$gezien_404" -eq 1 ] && [ "$klasse" = "github-404" ]; then
            echo "::error::live-route serveert de GitHub-Pages-404 — de noodpagina staat niet gepubliceerd."
            exit 1
          fi
          echo "::warning::live-route toont nog geen noodpagina maar ook geen 404 ('${klasse}') — waarschijnlijk CDN-lag (~10 min). Geen fout."
