name: autocoding-shield

# DIT BESTAND IS DE READ-ONLY PR-SHIELD. Verder niets.
#
# Het draait uitsluitend op `pull_request`, checkt de PR-head uit en voert dus PR-headcode uit
# (validator-, adapter- en publishertests, secretscan op de branchdiff). Precies daarom staat hier
# GEEN ENKELE schrijfscope: noch op bestandsniveau, noch op een job. Een PR mag zijn eigen workflow-
# definitie voorstellen, en op de `pull_request`-run draait GitHub die VOORGESTELDE definitie — niet
# de versie op de default branch. Een job met `statuses: write` in dit bestand zou een same-repo
# branch dus in staat stellen de stappen te vervangen en de poortstatus zelf groen te schrijven.
# Default-branch-checkout beschermt de scripts, maar niet de YAML die job en tokenpermissies
# definieert. De statuswriter staat daarom in een fysiek apart bestand dat door geen enkele
# PR-gecontroleerde event wordt gestart:
#
#   .github/workflows/autocoding-shield-live-gate.yml
#
# Die scheiding is geen stijlkeuze maar de vertrouwensgrens zelf, en wordt statisch afgedwongen door
# `test/autocoding-workflow-trust.test.mjs`.
#
# Nooit `pull_request_target`.

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: autocoding-shield-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  autocoding-shield:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bepaal bootstrapbeschikbaarheid
        id: bootstrap
        run: |
          set -euo pipefail
          if [ -f scripts/autocoding/verify-review-gate.mjs ] && \
             [ -f scripts/autocoding/collect-shield-input.mjs ] && \
             [ -f scripts/autocoding/publish-live-status.mjs ] && \
             [ -f scripts/autocoding/workflow-trust.mjs ] && \
             [ -f test/autocoding-review-gate.test.mjs ] && \
             [ -f test/autocoding-shield-adapter.test.mjs ] && \
             [ -f test/autocoding-live-status.test.mjs ] && \
             [ -f test/autocoding-workflow-trust.test.mjs ] && \
             [ -f CONTROL/AUTOCODING/policy.v1.json ]; then
            echo 'gate_files=true' >> "$GITHUB_OUTPUT"
          else
            echo 'gate_files=false' >> "$GITHUB_OUTPUT"
            echo 'BOOTSTRAP_GATE_FILES_ABSENT_ON_PR_HEAD'
          fi

      - name: Validator-, adapter- en vertrouwensgrenstests
        if: steps.bootstrap.outputs.gate_files == 'true'
        run: >-
          node --test test/autocoding-review-gate.test.mjs
          test/autocoding-shield-adapter.test.mjs test/autocoding-live-status.test.mjs
          test/autocoding-workflow-trust.test.mjs

      - name: Branchdiff op secrets toetsen
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA"...HEAD
          if git diff --unified=0 "$BASE_SHA"...HEAD | grep -E '^\+[^+].*(gh[pousr]_[A-Za-z0-9]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|AKIA[0-9A-Z]{16})'; then
            echo '::error::SECRET_PATTERN_DETECTED'
            exit 1
          fi
