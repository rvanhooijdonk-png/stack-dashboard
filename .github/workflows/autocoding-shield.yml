name: autocoding-shield

# DIT BESTAND IS DE ONPRIVILEGED HELFT. Het draagt GEEN ENKELE schrijfscope — niet op
# bestandsniveau, niet op een job — en dat is geen zuinigheid maar de vertrouwensgrens zelf.
#
# Op elk `pull_request*`-event draait GitHub de workflowdefinitie ZOALS DIE IN DE PR STAAT. Dat is
# hier gemeten, niet aangenomen: Actions-run `32542688290` draaide op event `pull_request_review` een
# workflowbestand dat op `main` 404 gaf. Een schrijfscope in dit bestand zou een same-repo branch dus
# in staat stellen de stappen te vervangen en de poortstatus zelf groen te schrijven.
#
# Dit bestand doet daarom precies twee dingen:
#
#   1. Op `pull_request`: de echte shieldcheck. Die checkt de PR-head uit en voert PR-headcode uit
#      (validator-, adapter-, publisher- en vertrouwensgrenstests, secretscan op de branchdiff).
#   2. Op `issue_comment` en `pull_request_review`: een SIGNAAL zonder inhoud. Geen checkout, geen
#      PR-code, `permissions: {}`. Het enige nut van die job is dat deze workflowrun voltooit,
#      waarna de trusted writer via `workflow_run` vanaf de DEFAULT BRANCH start.
#
# De statuswriter staat in een fysiek apart bestand dat door geen enkel direct PR-, comment- of
# reviewevent startbaar is:
#
#   .github/workflows/autocoding-shield-live-gate.yml
#
# Die scheiding wordt statisch afgedwongen door `test/autocoding-workflow-trust.test.mjs`, inclusief
# de regel dat een uitcheckende job hier tot `pull_request` beperkt moet blijven.
#
# Nooit `pull_request_target`.

on:
  pull_request:
    branches: [main]
  # Alleen als onprivileged signaal. Zie de job `autocoding-shield-signal` hieronder.
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

# Het event zit in de groepsleutel, zodat een signaalrun nooit een lopende of wachtende echte
# shieldcheck op dezelfde PR kan verdringen.
concurrency:
  group: autocoding-shield-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  autocoding-shield:
    # PR-code wordt uitsluitend op `pull_request` uitgevoerd, nooit op een comment of review.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bepaal bootstrapbeschikbaarheid
        id: bootstrap
        run: |
          set -euo pipefail
          if [ -f scripts/autocoding/verify-review-gate.mjs ] && \
             [ -f scripts/autocoding/collect-shield-input.mjs ] && \
             [ -f scripts/autocoding/publish-live-status.mjs ] && \
             [ -f scripts/autocoding/workflow-trust.mjs ] && \
             [ -f scripts/autocoding/select-live-gate-targets.mjs ] && \
             [ -f test/autocoding-review-gate.test.mjs ] && \
             [ -f test/autocoding-shield-adapter.test.mjs ] && \
             [ -f test/autocoding-live-status.test.mjs ] && \
             [ -f test/autocoding-workflow-trust.test.mjs ] && \
             [ -f test/autocoding-live-gate-targets.test.mjs ] && \
             [ -f CONTROL/AUTOCODING/policy.v1.json ]; then
            echo 'gate_files=true' >> "$GITHUB_OUTPUT"
          else
            echo 'gate_files=false' >> "$GITHUB_OUTPUT"
            echo 'BOOTSTRAP_GATE_FILES_ABSENT_ON_PR_HEAD'
          fi

      - name: Validator-, adapter- en vertrouwensgrenstests
        if: steps.bootstrap.outputs.gate_files == 'true'
        run: >-
          node --test test/autocoding-review-gate.test.mjs
          test/autocoding-shield-adapter.test.mjs test/autocoding-live-status.test.mjs
          test/autocoding-workflow-trust.test.mjs test/autocoding-live-gate-targets.test.mjs

      - name: Branchdiff op secrets toetsen
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA"...HEAD
          if git diff --unified=0 "$BASE_SHA"...HEAD | grep -E '^\+[^+].*(gh[pousr]_[A-Za-z0-9]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|AKIA[0-9A-Z]{16})'; then
            echo '::error::SECRET_PATTERN_DETECTED'
            exit 1
          fi

  # Het onprivileged signaal. Deze job leest niets, checkt niets uit en voert geen repositorycode
  # uit; hij bestaat alleen zodat de voltooiing van deze run de trusted writer via `workflow_run`
  # kan starten. Ook wanneer hij (op een issue zonder PR) wordt overgeslagen, voltooit de run en
  # krijgt de writer zijn aanleiding — die meet de doel-PR's toch zelf opnieuw.
  autocoding-shield-signal:
    if: >-
      github.event_name != 'pull_request'
      && (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Signaal zonder inhoud
        run: echo 'AUTOCODING_SHIELD_SIGNAL_ONLY'
