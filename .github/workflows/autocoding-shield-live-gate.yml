name: autocoding-shield-live-gate

# DIT BESTAND IS DE TRUSTED STATUSWRITER. Het is met opzet fysiek gescheiden van
# `.github/workflows/autocoding-shield.yml`, en het wordt door GEEN ENKEL direct PR-, comment- of
# reviewevent gestart.
#
# Waarom de vorige scheiding niet volstond — GEMETEN, niet beredeneerd. De eerdere versie luisterde
# naar `issue_comment` en `pull_request_review`, in de veronderstelling dat allebei die events altijd
# de default-branch-definitie draaien. Actions-run `32542688290` weerlegt dat: event
# `pull_request_review`, head `a2e7a64…`, bestand `.github/workflows/autocoding-shield-live-gate.yml`
# — terwijl de Contents API op `?ref=main` voor dat pad 404 gaf. Het bestand bestond dus NIET op de
# default branch en werd tóch uitgevoerd. De definitie kwam van de PR-head, inclusief de job met
# `statuses: write`. Dat de statusstappen daar toevallig oversloegen (poort uit) was geen grens.
#
# De grens die WEL bestaat is de officiële `workflow_run`-grens: zo'n workflow triggert alleen als
# zijn bestand op de default branch staat, en het event is er expliciet voor bedoeld om ná een
# onprivileged workflow een privileged workflow te starten. `schedule` heeft dezelfde eigenschap en
# vangt bovendien alles op wat geen signaal opleverde: edits, deletes, dismissals, gemiste runs.
#
# Wat deze job WEL doet: de default branch uitchecken, de doel-PR's OPNIEUW bepalen via read-only
# GitHub-API's, elke doel-PR read-only meten, en de uitspraak als commitstatus publiceren op de
# GEMETEN head, onder de context `autocoding-shield-live-receipts` uit `policy.live_status_context`.
#
# Wat deze job NOOIT doet: PR-headcode uitvoeren, PR-headpolicy lezen, artifacts, cache of outputs
# van de bronrun lezen, de event-PR-head geloven, secrets lezen, mergen, deployen, of iets anders
# schrijven dan commitstatussen. `statuses: write` is de enige schrijfscope in dit bestand en er is
# precies één job. De `workflow_run`-payload is hooguit een HINT die de doellijst mag versmallen.
#
# BOOTSTRAP, eerlijk benoemd: een `workflow_run`-workflow bestaat pas ná merge op de default branch.
# PR #74 kan deze keten dus niet zelf live bewijzen. De empirische run `32542688290` is juist het
# bewijs dat de vorige, direct getriggerde vorm verboden moest worden. De poort staat bovendien nog
# uit (`live_receipt_gate_enabled: false`) en deze PR zet geen ruleset of required check aan.

on:
  # Uitsluitend de voltooiing van de onprivileged shield. De naam is hier gepind; het PAD en het
  # bronevent worden verderop nog eens in de trusted checkout getoetst.
  workflow_run:
    workflows: [autocoding-shield]
    types: [completed]
  # Convergentiefallback: edits, deletes en dismissals leveren niet altijd een shieldrun op, en een
  # gemiste of geannuleerde signaalrun mag geen status voor altijd stale laten staan.
  schedule:
    - cron: '23 * * * *'

permissions: {}

# ÉÉN GLOBALE WRITERLOCK. De groep is een CONSTANTE: geen `${{ ... }}`, dus geen branch, geen
# run-id, geen event. Reden, gemeten aan het ontwerp en niet aan de intentie: alle aanleidingen —
# een review-run, een commentrun en de uurlijkse ronde — schrijven dezelfde gedeelde statuscontext
# (`policy.live_status_context`) op dezelfde head. De vorige groep sleutelde op
# `workflow_run.head_branch || run_id`, waardoor die drie in ONDERSCHEIDEN groepen vielen en dus
# gelijktijdig draaiden. Twee gelijktijdige runs lezen dan elk een eigen momentopname, en de run met
# de OUDERE momentopname kan als laatste publiceren. Reageerde de nieuwere run op een verwijderd of
# bewerkt receipt, dan zet de oudere `success` terug en staat de poort stale groen tot een volgende
# ronde. Eén constante groep maakt dat onmogelijk: er is hooguit één writer tegelijk.
#
# `cancel-in-progress: false` — een lopende ronde wordt nooit halverwege afgekapt, want dat zou
# statussen van al geselecteerde maar nog niet gepubliceerde PR's stale laten staan.
#
# De lock wordt VÓÓR de eerste stap verworven, want `concurrency` staat hier op workflowniveau. Elke
# meting in dit bestand gebeurt daarna: de open-PR-lijst en alle zes GET's per PR staan in de enige
# job. Er wordt niets meegenomen wat vóór de lock is gemeten — geen artifact, geen cache, geen
# output en geen veld uit de bronrun (de payload is hooguit een hint op de doelselectie).
#
# Eerlijke grens: GitHub houdt per groep hooguit één WACHTENDE run aan en annuleert een eerder
# wachtende. Dat is hier onschadelijk voor de gedeelde statuscontext, want iedere writer hermeet de
# volledige toestand via de API en de uurlijkse `schedule` doet altijd een volledige ronde. Een
# geannuleerde wachtende run kan dus hooguit een versmalde hermeting uitstellen tot die volgende
# volledige ronde; hij kan nooit een oudere uitspraak over een nieuwere heen schrijven.
concurrency:
  group: autocoding-shield-live-gate
  cancel-in-progress: false

jobs:
  autocoding-shield-live-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # De enige schrijfscope in dit bestand, op de enige job in dit bestand. Geen `contents: write`,
      # geen `actions: write`, geen `pull-requests: write`, geen `id-token: write`, geen secrets.
      statuses: write
    steps:
      # Altijd de default branch. De poort mag nooit door PR-headcode of PR-headpolicy worden
      # bestuurd, en van de bronrun wordt niets overgenomen.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Bepaal bootstrapbeschikbaarheid
        id: bootstrap
        run: |
          set -euo pipefail
          if [ -f scripts/autocoding/verify-review-gate.mjs ] && \
             [ -f scripts/autocoding/collect-shield-input.mjs ] && \
             [ -f scripts/autocoding/publish-live-status.mjs ] && \
             [ -f scripts/autocoding/select-live-gate-targets.mjs ] && \
             [ -f CONTROL/AUTOCODING/policy.v1.json ]; then
            echo 'trusted_gate_files=true' >> "$GITHUB_OUTPUT"
          else
            echo 'trusted_gate_files=false' >> "$GITHUB_OUTPUT"
            echo 'BOOTSTRAP_TRUSTED_GATE_FILES_NOT_ON_DEFAULT_BRANCH'
          fi

      - name: Bepaal poortstand en statuscontext
        id: enabled
        if: steps.bootstrap.outputs.trusted_gate_files == 'true'
        run: |
          set -euo pipefail
          enabled="$(node -p "JSON.parse(require('fs').readFileSync('CONTROL/AUTOCODING/policy.v1.json','utf8')).live_receipt_gate_enabled === true")"
          context="$(node -p "String(JSON.parse(require('fs').readFileSync('CONTROL/AUTOCODING/policy.v1.json','utf8')).live_status_context || '')")"
          if [ "$enabled" != true ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'BOOTSTRAP_RECEIPT_GATE_DISABLED'
            exit 0
          fi
          test -n "$context"
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
          echo "status_context=$context" >> "$GITHUB_OUTPUT"

      # De doel-PR's worden hier OPNIEUW bepaald uit een read-only lijst van open pull requests. Dit
      # is de EERSTE meting van de ronde en hij gebeurt binnen de globale writerlock, niet ervoor.
      # `--paginate` haalt de lijst volledig op: er is geen bovengrens op het aantal open PR's, want
      # een geweigerde ronde publiceert nul statussen en laat een eerder groene head groen staan.
      # De eventpayload gaat als hint naar binnen en kan de lijst hooguit versmallen tot één
      # eenduidige treffer; hij kan er nooit een PR aan toevoegen. Een onverwachte bron levert rc 2
      # op: niets publiceren, en dat is geen fout van deze poort. Alleen een onleesbare of
      # onvolledig opgehaalde lijst is rc 1: dan is onbekend WELKE PR's bestaan, dus wordt er niets
      # gepubliceerd en is de run rood.
      - name: Bepaal de doel-PR's opnieuw via read-only API
        id: targets
        if: steps.enabled.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail
          if ! gh api --paginate --slurp "repos/$REPOSITORY/pulls?state=open&per_page=100" \
            > "$RUNNER_TEMP/open-pulls.json"; then
            echo '::error::OPEN_PULL_REQUEST_LIST_UNAVAILABLE'
            exit 1
          fi
          rc=0
          node scripts/autocoding/select-live-gate-targets.mjs \
            --event-name "$EVENT_NAME" \
            --event "$GITHUB_EVENT_PATH" \
            --open-pulls "$RUNNER_TEMP/open-pulls.json" \
            --out "$RUNNER_TEMP/targets.txt" || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo 'targets_ready=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'targets_ready=false' >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 2 ]; then
            exit 0
          fi
          exit 1

      # Per doel-PR: meten, beslissen, publiceren. Elke PR is een eigen record. Een fout bij één PR
      # maakt de job rood maar stopt de ronde niet — anders zou de eerste kapotte PR alle andere
      # statussen stale laten staan. De doellijst wordt via een eigen bestandsdescriptor gelezen,
      # zodat `gh` de standaardinvoer van de lus niet kan opslokken.
      - name: Meet, beslis en publiceer per doel-PR
        if: steps.targets.outputs.targets_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          STATUS_CONTEXT: ${{ steps.enabled.outputs.status_context }}
        run: |
          set -uo pipefail
          overall=0

          while IFS= read -r number <&3; do
            case "$number" in
              ''|*[!0-9]*) continue ;;
            esac

            raw="$RUNNER_TEMP/raw/$number"
            rm -rf "$raw"
            mkdir -p "$raw"
            execution_error=''

            # De gemeten head is de drager van de hele publicatie: zonder head is er geen commit om
            # de uitspraak op te schrijven. Daarom herhaalpogingen, en daarom is dit het enige geval
            # waarin een PR zonder status blijft — expliciet gelogd en record-lokaal rood.
            head_sha=''
            for attempt in 1 2 3; do
              if gh api "repos/$REPOSITORY/pulls/$number" > "$raw/pr.json"; then
                head_sha="$(node -e 'const p=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));const s=(p.head||{}).sha;if(!/^[0-9a-f]{40}$/.test(s||""))process.exit(1);process.stdout.write(s)' "$raw/pr.json" || true)"
                if [ -n "$head_sha" ]; then break; fi
              fi
              if [ "$attempt" -lt 3 ]; then sleep 5; fi
            done
            if [ -z "$head_sha" ]; then
              echo "::error::PR_${number}_HEAD_UNMEASURED"
              overall=1
              continue
            fi

            # Uitsluitend read-only GET's. Geen enkel veld hieruit wordt gelogd.
            for endpoint in \
              "git/commits/$head_sha:head-commit" \
              "pulls/$number/commits:pr-commits" \
              "issues/$number/comments:issue-comments" \
              "pulls/$number/reviews:reviews" \
              "pulls/$number/comments:review-comments" \
              "pulls/$number/files:files"; do
              path="${endpoint%%:*}"
              name="${endpoint##*:}"
              if [ "$name" = 'head-commit' ]; then
                gh api "repos/$REPOSITORY/$path" > "$raw/$name.json" || execution_error='GATE_EXECUTION_ERROR'
              else
                gh api --paginate --slurp "repos/$REPOSITORY/$path" > "$raw/$name.json" \
                  || execution_error='GATE_EXECUTION_ERROR'
              fi
            done

            # De uitspraak. Een NO_GO eindigt hier non-zero; dat is geen uitvoeringsfout maar de
            # uitkomst zelf, en de publicatie hieronder is de poort. Een echte crash laat
            # `gate-result.json` onleesbaar achter en wordt door de publisher als zodanig gemeld.
            rm -f "$raw/gate-result.json"
            if [ -z "$execution_error" ]; then
              if node scripts/autocoding/collect-shield-input.mjs \
                --raw "$raw" \
                --policy CONTROL/AUTOCODING/policy.v1.json \
                --out-context "$raw/context.json" \
                --out-shield-input "$raw/shield-input.json"; then
                node scripts/autocoding/verify-review-gate.mjs \
                  --shield-input "$raw/shield-input.json" \
                  --context "$raw/context.json" \
                  --policy CONTROL/AUTOCODING/policy.v1.json > "$raw/gate-result.json" || true
              fi
            fi

            # Publiceert ALTIJD op de gemeten head, onder de vaste context. `success` uitsluitend bij
            # een bewezen GO; elke NO_GO, parsefout, truncatie, ontbrekend bewijs of uitvoeringsfout
            # wordt `failure` op diezelfde head.
            if ! node scripts/autocoding/publish-live-status.mjs \
              --repository "$REPOSITORY" \
              --head-sha "$head_sha" \
              --status-context "$STATUS_CONTEXT" \
              --gate-result "$raw/gate-result.json" \
              --execution-error "$execution_error"; then
              overall=1
            fi
          done 3< "$RUNNER_TEMP/targets.txt"

          exit "$overall"
