name: waarnemer

# DE PLAAT BEWAAKT ZICHZELF.
#
# `publish.yml` bewijst dat een BOUW slaagde. Deze workflow bewijst iets anders: dat de PAGINA die
# een bezoeker nu ophaalt ook klopt — bestaat, is vers genoeg, toont dezelfde laatste melding als de
# bron, en heeft geen lege of kapotte blokken. Een geslaagde build naast een uren oude pagina is
# precies de storing die niemand ziet; dit is de controle die haar wél ziet.
#
# Vier momenten:
#  - na elke publicatie (workflow_run op `publish`), want dan hoort de plaat te zijn bijgewerkt;
#  - op een klok, want een pagina kan ook oud worden zonder dat er iets draaide. Eén keer per uur,
#    bewust niet vaker: in deze repo is gemeten (23-07-2026, vastgelegd in publish.yml) dat GitHub
#    kwartiercrons hier in de praktijk overslaat. Een lage frequentie die wél vuurt is meer waard;
#  - bij elke wijziging aan de waarnemer zelf, op welke tak dan ook — wie de bewaker verandert,
#    laat de bewaker meteen draaien;
#  - met de hand, met een sabotage-schakelaar voor het acceptatiebewijs.
#
# Een afwijking doet twee dingen tegelijk: de run wordt rood ÉN er komt een GEBLOKKEERD-regel in de
# publieke spiegel. Alleen rood zijn is niet genoeg — dan staat het falen in een logboek dat niemand
# opent, terwijl Richard naar de plaat kijkt.
on:
  workflow_run:
    workflows: [publish]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - '.github/workflows/waarnemer.yml'
      - 'scripts/waarnemer.mjs'
      - 'scripts/lib/waarnemer.mjs'
      - 'scripts/lib/spiegelwet.mjs'
      - 'data/kanaalpost-publiek.md'
  workflow_dispatch:
    inputs:
      sabotage:
        description: 'Acceptatietest: forceer één toets te falen (stempel = drempel op nul).'
        type: choice
        options: [geen, stempel]
        default: geen

# Standaard niets; elke job krijgt hieronder precies wat hij nodig heeft.
permissions: {}

# Niet annuleren: een lopende ronde die net de spiegel aan het aanvullen is, mag niet halverwege
# worden afgekapt.
concurrency:
  group: waarnemer
  cancel-in-progress: false

jobs:
  toetsen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      afwijking: ${{ steps.toets.outputs.afwijking }}
      appenden: ${{ steps.toets.outputs.appenden }}
      rij_b64: ${{ steps.toets.outputs.rij_b64 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'

      # De toetsende stap mag de run NIET zelf rood maken: dan zou de melding-job zijn uitkomsten
      # niet betrouwbaar kunnen lezen. De poort onderaan maakt de run rood, ná het melden. Zo is de
      # volgorde vast: eerst zichtbaar maken waar Richard kijkt, dan pas falen.
      - id: toets
        continue-on-error: true
        env:
          BASE_URL: https://rvanhooijdonk-png.github.io/stack-dashboard/
          SPIEGEL_URL: https://raw.githubusercontent.com/rvanhooijdonk-png/stack-dashboard/main/data/kanaalpost-publiek.md
          # Twee wegen naar de sabotagetest. Met de hand (workflow_dispatch) kan pas als deze
          # workflow op de hoofdtak staat; daarvóór — en later ook nog — kan het met een commit die
          # `[sabotage]` in zijn bericht draagt. Zo is het acceptatiebewijs op ELKE tak te herhalen,
          # ook op de tak waarop de waarnemer wordt ingevoerd. Bewust zichtbaar en niet stiekem: de
          # alarmregel die eruit komt zegt in de spiegel zelf dat hij een test is.
          SABOTAGE: ${{ inputs.sabotage || (contains(github.event.head_commit.message || '', '[sabotage]') && 'stempel' || 'geen') }}
        run: node scripts/waarnemer.mjs

  # Falen hoort zichtbaar te zijn op de plek waar Richard kijkt. Deze job heeft als enige
  # schrijfrechten, en doet als enige één ding: de al door de publicatiepoort gehaalde alarmregel
  # onderaan de publieke spiegel zetten.
  melden:
    needs: toetsen
    if: ${{ !cancelled() && needs.toetsen.outputs.afwijking == 'ja' && needs.toetsen.outputs.appenden == 'ja' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      # Bewust GEEN `actions: write` hier: deze job haalt de repo op en voert er code uit. Zou hij
      # ook workflows mogen starten, annuleren of uitzetten, dan zou iedereen met pushrecht op een
      # tak dat recht in één push naar zich toe kunnen trekken. Het starten van een verse publicatie
      # gebeurt daarom in `verversen`, hieronder, zonder checkout en alleen op de hoofdtak.
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.ref_name }}

      - name: Alarmregel aan de publieke spiegel toevoegen
        env:
          RIJ_B64: ${{ needs.toetsen.outputs.rij_b64 }}
        run: |
          set -euo pipefail
          if [ -z "${RIJ_B64:-}" ]; then
            echo "::error::geen alarmregel doorgekregen van de toets-job — er wordt niets geschreven."
            exit 1
          fi
          printf '%s' "$RIJ_B64" | base64 -d >> data/kanaalpost-publiek.md
          tail -1 data/kanaalpost-publiek.md
          # Fail-closed: wat we net toevoegden moet ook echt als publieke rij terugkomen. Komt hij
          # niet door de poort, dan draaien we de wijziging terug in plaats van een regel achter te
          # laten die de plaat stilletjes weglaat.
          node -e '
            const { readFileSync } = require("node:fs");
            const regel = Buffer.from(process.env.RIJ_B64, "base64").toString("utf8").trim();
            Promise.all([import("./scripts/lib/kanaalpost.mjs"), import("./scripts/lib/waarnemer.mjs")])
              .then(([{ kanaalpostUitTekst, toPublicKanaalpost }]) => {
                const uit = toPublicKanaalpost(kanaalpostUitTekst(readFileSync("data/kanaalpost-publiek.md", "utf8")));
                const bovenaan = uit.rows?.[0];
                // Niet "er staat een WAARNEMER bovenaan" — dat kan een oudere melding zijn terwijl de
                // nieuwe regel buiten de tabel viel. Het moet DEZE regel zijn, veld voor veld.
                const cellen = regel.split("|").slice(1, -1).map((c) => c.trim());
                const zelfde = bovenaan
                  && bovenaan.tab === cellen[1] && bovenaan.onderwerp === cellen[2]
                  && bovenaan.status === cellen[3] && bovenaan.datum === cellen[0];
                if (!uit.available || !zelfde) {
                  console.error("::error::de zojuist toegevoegde alarmregel komt niet als bovenste publieke rij terug.");
                  process.exit(1);
                }
                console.log("alarmregel staat bovenaan de publieke stand.");
              }).catch(() => { console.error("::error::poortcontrole mislukt"); process.exit(1); });
          '
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/kanaalpost-publiek.md
          git commit -m 'chore(waarnemer): automatische GEBLOKKEERD-melding — de plaat wijkt af van de bron'
          # Een gelijktijdige push mag deze melding niet laten verdampen: opnieuw ophalen, erbovenop
          # zetten, nog eens proberen.
          for poging in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push-poging ${poging} mislukt — opnieuw ophalen en herplaatsen"
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "::error::de alarmregel kon niet naar de tak worden geschreven."
          exit 1

  # Losse job met precies één recht en geen repo-code: een push met GITHUB_TOKEN start zelf geen
  # workflow, dus zonder deze zet zou de alarmregel pas bij de volgende bouw op de plaat verschijnen.
  verversen:
    needs: melden
    if: ${{ needs.melden.result == 'success' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Verse publicatie starten zodat de melding op de plaat komt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run publish.yml --ref main

  # DE SPIEGELWET. Op 26-07-2026 heeft de waarnemer een GEBLOKKEERD-regel in de publieke spiegel
  # gezet en heb ik die bij het opruimen weggehaald (commit 211faaf, één regel `-`). De spiegel is
  # append-only; dat was dus een overtreding, hersteld met de regel teruggezet plus een correctie
  # eronder. Deze job zorgt dat de volgende keer niet van oplettendheid afhangt: vergelijken gebeurt
  # met de versie op het AFTAKPUNT, niet met de top van main — een tak die achterloopt mist regels
  # zonder ze te hebben weggehaald, en dat is geen overtreding.
  spiegelwet:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
      # TWEE vergelijkingen, want één is aantoonbaar niet genoeg. Mijn eigen overtreding zat binnen
      # één tak: de bot voegde de regel toe (push 1), ik haalde hem weg (push 2). Tegen het aftakpunt
      # gemeten is er dan niets verdwenen — die controle had mij dus niet gevangen. Daarom eerst de
      # vergelijking met de VORIGE stand van deze tak (`before`), die precies dat geval ziet, en
      # daarnaast het aftakpunt, dat een tak vangt die met opzet regels van main weglaat.
      - name: De publieke spiegel is alleen aangevuld, nooit gewijzigd
        env:
          VOOR: ${{ github.event.before }}
        run: |
          set -uo pipefail
          leeg=0000000000000000000000000000000000000000
          toets() { # $1 = commit, $2 = omschrijving
            # Onderscheid maken tussen "bestond nog niet" en "kon niet gelezen worden". Alles op één
            # hoop gooien zou een leesfout als een lege oude spiegel behandelen, en dan is elke
            # verwijdering ineens toegestaan (bevinding Codex, 26-07-2026).
            if git cat-file -e "$1:data/kanaalpost-publiek.md" 2>/dev/null; then
              if ! git show "$1:data/kanaalpost-publiek.md" > /tmp/spiegel-oud.md; then
                echo "::error::de spiegel van $2 is niet te lezen — dat is rood, niet leeg."
                return 1
              fi
            else
              echo "$2: de spiegel bestond daar nog niet."
              : > /tmp/spiegel-oud.md
            fi
            OUD=/tmp/spiegel-oud.md WAT="$2" node -e '
              const { readFileSync } = require("node:fs");
              import("./scripts/lib/spiegelwet.mjs").then(({ alleenAangevuld }) => {
                const r = alleenAangevuld(readFileSync(process.env.OUD, "utf8"), readFileSync("data/kanaalpost-publiek.md", "utf8"));
                if (!r.ok) {
                  console.error(`::error::append-only overtreden t.o.v. ${process.env.WAT}: ${r.verdwenen} regel(s) verdwenen. Zet terug wat er stond en schrijf de correctie eronder.`);
                  process.exit(1);
                }
                if (!r.opOrde) console.log(`::warning::${process.env.WAT}: niets verdwenen, maar de volgorde wijkt af vanaf regel ${r.eerste} (samenvoeging?).`);
                console.log(`${process.env.WAT}: geen regel verdwenen.`);
                process.exit(0);
              }).catch(() => { console.error("::error::spiegelwet niet te laden — dat is rood."); process.exit(1); });
            '
          }
          fout=0
          if [ -n "${VOOR:-}" ] && [ "${VOOR}" != "${leeg}" ] && git cat-file -e "${VOOR}^{commit}" 2>/dev/null; then
            toets "${VOOR}" "de vorige stand van deze tak" || fout=1
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            # Op de hoofdtak is een ontbrekende vorige stand geen onschuldig geval: dat is een
            # force-push of een herschreven historie, precies waar deze wet over gaat. Dus rood.
            echo "::error::op main is er geen bruikbare vorige stand (force-push of herschreven historie) — niet te beoordelen, dus rood."
            fout=1
          else
            echo "geen bruikbare vorige stand (nieuwe tak of force-push) — alleen tegen het aftakpunt getoetst."
          fi
          BASIS="$(git merge-base HEAD origin/main || true)"
          if [ -z "${BASIS}" ]; then
            echo "::error::geen gemeenschappelijk aftakpunt met main gevonden — niet te beoordelen, dus rood."
            exit 1
          fi
          toets "${BASIS}" "het aftakpunt met main" || fout=1
          exit "${fout}"

  # De run is pas rood NA het melden. Deze poort bestaat apart zodat "zichtbaar maken" en "falen"
  # niet om dezelfde exitcode hoeven te vechten.
  poort:
    needs: [toetsen, melden, spiegelwet]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # De spiegelwet hangt hieronder, niet ernaast: wordt ooit alleen `poort` als vereiste controle
      # ingesteld, dan zou een rode spiegelwet naast een groene poort onzichtbaar blijven (bevinding
      # Codex, 26-07-2026). `skipped` is hier geen fout — de job draait alleen op push.
      - name: Spiegelwet meenemen
        env:
          SPIEGELWET: ${{ needs.spiegelwet.result }}
        run: |
          set -uo pipefail
          case "${SPIEGELWET:-}" in
            success|skipped) echo "spiegelwet: ${SPIEGELWET:-leeg}" ;;
            *) echo "::error::de spiegelwet-controle is niet geslaagd (${SPIEGELWET:-leeg})."; exit 1 ;;
          esac
      - name: Afwijking = rode run
        env:
          AFWIJKING: ${{ needs.toetsen.outputs.afwijking }}
          GEMELD: ${{ needs.melden.result }}
        run: |
          set -uo pipefail
          if [ "${AFWIJKING:-}" = "nee" ]; then
            echo "✓ de openbare plaat komt overeen met de bron."
            exit 0
          fi
          if [ "${AFWIJKING:-}" = "ja" ]; then
            echo "::error::de openbare plaat wijkt af van de bron (spiegelmelding: ${GEMELD})."
            exit 1
          fi
          echo "::error::de waarnemer heeft geen uitkomst opgeleverd — dat is zelf een afwijking."
          exit 1

# ACCEPTATIE — het bewijs dat deze bewaker echt bijt.
# Een bewaker die nooit heeft gepiept is niet bewezen stil, alleen ongetest. Daarom is de
# sabotagetest onderdeel van dit bestand en niet van een eenmalig verslag: zet `[sabotage]` in een
# commit-bericht dat een van de waarnemer-bestanden raakt (of kies `stempel` bij een handmatige
# start), en de stempeltoets krijgt drempel nul. Verwachte uitkomst: rode run, plus één
# GEBLOKKEERD-regel in de publieke spiegel die er zelf bij zegt dat hij een test is. Herhaalbaar,
# op elke tak, ook lang nadat iedereen deze PR vergeten is.
