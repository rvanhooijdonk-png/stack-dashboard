name: pr-check

# Bewust een eigen bestand naast publish.yml, niet een extra trigger daarin. Twee redenen:
# publish.yml deelt `concurrency: group: pages` met `cancel-in-progress: true`, dus een
# PR-run zou daar een lopende live-deploy kunnen afbreken; en "geen deploy vanaf een PR"
# is hier een eigenschap van het bestand — er staat simpelweg geen deploy-job in — in
# plaats van een `if`-conditie die iemand later per ongeluk kan verruimen.
on:
  pull_request:
    branches: [main]

permissions: {}

# Per pull request, niet de gedeelde pages-groep: een nieuwe push op een PR mag alleen de
# vorige controle van diezelfde PR afbreken.
concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Zelfde pin als publish.yml. test/workflows.test.mjs faalt als die twee uit elkaar lopen.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  controle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'

      - name: Tests
        run: node --test

      - name: gitleaks installeren (gepind + checksum)
        run: |
          set -euo pipefail
          curl -sSL --fail -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Zelftest — een nepsecret MOET de scan laten falen
        run: |
          set -euo pipefail
          mkdir -p /tmp/gate-selftest
          # Het nepsecret moet er ook vóór de scanner als een secret uitzien. `ghp_` gevolgd door
          # 36× dezelfde letter haalt de entropiedrempel van de github-pat-regel niet: gemeten op
          # gitleaks 8.30.1 wordt zo'n token NIET gevonden, en dan meldt deze zelftest ten
          # onrechte dat de poort stuk is. Een bekend voorbeeldsecret werkt om dezelfde reden
          # niet — de AWS-documentatiesleutel staat op de allowlist van gitleaks zelf, gemeten.
          # Dus een verse willekeurige waarde per run; die staat ook nergens in de repo.
          # Apart genereren, want een mislukte openssl binnen $(...) wordt door de printf
          # eromheen gemaskeerd en zou hier als "poort stuk" uitkomen.
          achtervoegsel="$(openssl rand -hex 18)" || true
          [ ${#achtervoegsel} -eq 36 ] || { echo "::error::kon geen nepsecret genereren (openssl) — er wordt niet gepubliceerd."; exit 1; }
          printf 'token: ghp_%s\n' "$achtervoegsel" > /tmp/gate-selftest/leak.txt
          # Eigen exitcode, want gitleaks gebruikt 1 zowel voor "gevonden" als voor een
          # scannerfout (gemeten: ontbrekende map en onleesbare config geven allebei 1). Met de
          # standaardcode zou een kapotte scanner hier als geslaagde zelftest doorgaan — precies
          # het fail-open dat deze stap moet uitsluiten. Nu telt alleen 42 als "gevonden".
          set +e
          ./gitleaks dir /tmp/gate-selftest --redact --exit-code 42 --no-banner
          code=$?
          set -e
          if [ "$code" -ne 42 ]; then
            echo "::error::zelftest mislukt (gitleaks exit $code; 42 = nepsecret gevonden, 0 = niet gevonden, anders scannerfout) — er wordt niet gepubliceerd."
            exit 1
          fi
          echo "zelftest ok: gitleaks faalt op een geplant nepsecret"
          rm -rf /tmp/gate-selftest

      # Genereren hoort erbij: zonder output valt er niets te saneren en niets te scannen.
      # Er wordt hier alleen gebouwd en gecontroleerd — nergens geüpload of gepubliceerd.
      #
      # Nadrukkelijk NIET ORG_PR_READ_TOKEN, anders dan in publish.yml. Bij een pull request
      # vanuit een branch in deze repository zijn repository- en org-secrets gewoon
      # beschikbaar, terwijl checkout het merge-resultaat inclusief de PR-code uitvoert. Een
      # PR die scripts/build.mjs of deze workflow aanpast zou het org-token dan kunnen
      # wegsturen; `permissions:` beperkt alleen GITHUB_TOKEN, niet een eigen secret. Het
      # alternatief pull_request_target is juist gevaarlijker zodra er PR-code draait.
      # Gevolg: de org-brede PR-secties vallen in deze controle terug op SOURCE_UNAVAILABLE.
      # Dat is precies wat we hier willen weten — dat de generator en de saneerpoort werken,
      # niet of het org-token geldig is. Die laatste vraag beantwoordt de main-run.
      - name: Genereren (read-only aggregatie)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/build.mjs

      - name: Alleen toegestane bestanden in de publicatiemap
        run: |
          set -euo pipefail
          onverwacht=$(find public -mindepth 1 \
            ! -name 'index.html' ! -name 'status.json' ! -name '.nojekyll' -printf '%P\n')
          if [ -n "$onverwacht" ]; then
            echo "::error::onverwachte bestanden in public: $onverwacht"
            exit 1
          fi

      - name: gitleaks op de output
        run: ./gitleaks dir public --redact --exit-code 1 --no-banner
