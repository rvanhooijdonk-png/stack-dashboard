name: doorstroom

# DE OVERZETTING ZONDER MENS.
#
# Wat kapot was, gemeten op 27-07-2026: elk venster zette zijn eigen spiegelrij in DEZELFDE regel van
# DEZELFDE tabel via een eigen bundel. Twee vensters tegelijk = botsing, per constructie. Op het
# moment van deze fix stonden er 16 unieke rijen in 9 openstaande bundels, waarvan er 8 niet meer
# samen te voegen waren. Vier bundels waren onderweg gesloten of gesneuveld. De rijen waren niet
# zoek — ze stonden vast achter een handmatige handeling die niemand op tijd deed.
#
# De omkering: een venster levert één rij als één BESTAND aan (`CONTROL/SPIEGEL/INBOX/`, naam
# `YYYY-MM-DDTHH-MM-<venster>-<slug>.md`, op de tak waar vensters toch al hun rapporten zetten).
# Twee bestanden botsen niet. Deze workflow is de enige schrijver van de publieke spiegel en oordeelt
# PER RIJ: een onbruikbare rij wordt geweigerd met reden, de rest gaat gewoon door. Dat is precies wat
# een handmatige bundel nooit kon — die viel als geheel om.
#
# DE KLOK. Niet op een kwartiercron. Gemeten in deze repo (27-07-2026, 05:30 UTC): van de zes
# uurslots die `waarnemer.yml` in de vijf uur ervoor had moeten vuren, vuurde er ÉÉN, 42 minuten te
# laat; `publish.yml` had in diezelfde periode 20 opeenvolgende runs op de kwartierslag, allemaal via
# `workflow_dispatch`. GitHub's eigen planner is hier dus aantoonbaar geen klok, en de dispatch-keten
# aantoonbaar wel. Daarom hangt deze workflow aan `workflow_run` op `publish` — dezelfde route die
# `waarnemer.yml` al zonder gaten gebruikt — met de uurcron er als zwakke reserve naast, niet als
# fundament.
#
# WAT DIT NIET DOET: niets mergen, niets weggooien, geen bestaande regel aanraken. De spiegel is
# append-only; dat wordt twee keer getoetst (in de uitvoerder én hier, vóór de push).
on:
  workflow_run:
    workflows: [publish]
    types: [completed]
  schedule:
    - cron: '52 * * * *'
  push:
    paths:
      - '.github/workflows/doorstroom.yml'
      - 'scripts/doorstroom.mjs'
      - 'scripts/lib/doorstroom.mjs'
      - 'test/doorstroom.test.mjs'
      - 'data/vloot.json'
  workflow_dispatch:

permissions: {}

# Nooit annuleren: deze workflow schrijft. Een halverwege afgebroken schrijver is erger dan een
# dubbele run — de tweede run is idempotent (een al gepubliceerde rij wordt niet nog eens gezet).
concurrency:
  group: doorstroom
  cancel-in-progress: false

jobs:
  overzetten:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # alleen om de publieke spiegel aan te vullen
      issues: write     # de alarmroute die NIET door de spiegel loopt
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'

      # Dezelfde poort als in `publish.yml`, om dezelfde reden: kaal `node --test` geeft exit 0 bij
      # nul gevonden tests. Een schrijver die op een leeggelopen testontdekking groen draait, schrijft
      # met ongetoetst oordeel in een bestand dat niemand meer kan repareren.
      #
      # `continue-on-error: true` (Codex-bevinding 1, ALARM-DAT-ELKE-RUN-MAILT-review 28-07-2026): zonder
      # dit zette een falende Tests/Overzetten/Vastleggen-stap de JOB al op rood vóór de alarmstap ook
      # maar draaide — de `exit 0` van de alarmstap bij een bekende, al gemelde oorzaak maakte dat niet
      # ongedaan, en GitHub mailde alsnog via de native workflow-faalroute (route 1 hieronder), buiten
      # de ontdubbeling om. Met `continue-on-error: true` wordt de JOB-conclusie uitsluitend bepaald
      # door de laatste stap ("Alarm buiten de keten") — de enige stap die de herhaal-drempel kent. De
      # `id:`'s (`tests`/`overzetten`/`vastleggen`) en de `if: steps.X.outcome == 'success'`-ketens
      # zorgen dat een écht kapotte stap latere schrijfstappen nog steeds overslaat (outcome blijft
      # zichtbaar ondanks continue-on-error; alleen conclusion wordt gemaskeerd).
      - name: Tests
        id: tests
        continue-on-error: true
        env:
          TESTS_ONDERGRENS: "50"
        run: |
          set -euo pipefail
          node --test --test-reporter=tap 2>&1 | tee /tmp/tests.tap
          total="$(grep -E '^# tests [0-9]+' /tmp/tests.tap | tail -1 | grep -oE '[0-9]+' || echo 0)"
          echo "Ontdekte tests: ${total} (ondergrens ${TESTS_ONDERGRENS})"
          if [ "${total:-0}" -lt "${TESTS_ONDERGRENS}" ]; then
            echo "::error title=Testontdekking leeggelopen::${total} tests < ondergrens ${TESTS_ONDERGRENS}." >&2
            exit 1
          fi

      # Zonder token is de bron (privérepo) onbereikbaar. Dat is met opzet een ROOD oordeel en geen
      # stille nul: "ik zie geen rijen" en "ik mag de rijen niet zien" mogen nooit hetzelfde betekenen.
      # De waarde wordt nergens afgedrukt; de uitvoerder draagt hem alleen in een header.
      - name: Overzetten (bron → publieke spiegel)
        id: overzetten
        continue-on-error: true
        if: steps.tests.outcome == 'success'
        env:
          CONTROL_READ_TOKEN: ${{ secrets.ORG_PR_READ_TOKEN }}
          # DOORSTROOM_PLAAT_URL komt uit `scripts/doorstroom.mjs`, afgeleid uit
          # `GITHUB_REPOSITORY` (zie `scripts/lib/repo-identity.mjs`). De BRON blijft
          # `stack-control` op het persoonlijke account: dat object verhuist niet mee.
        run: |
          set -euo pipefail
          if [ "${{ github.ref_name }}" = "main" ]; then
            node scripts/doorstroom.mjs --schrijf --uitvoer /tmp/oordeel.json
          else
            echo "niet op main (${{ github.ref_name }}) — alleen kijken, niet schrijven"
            node scripts/doorstroom.mjs --uitvoer /tmp/oordeel.json
          fi

      # Push met een rebase ertussen: een mens mag ondertussen best iets aan main hebben toegevoegd.
      # Onze commit voegt alleen achteraan toe, dus na een rebase geldt de append-only-wet nog steeds —
      # en de uitvoerder heeft die vlak voor het schrijven zelf al getoetst. Lukt de push alsnog niet,
      # dan is dat een storing en geen "volgende keer beter": exit 1, en de alarmstap hieronder ziet het.
      - name: Aanvulling vastleggen
        id: vastleggen
        continue-on-error: true
        if: github.ref_name == 'main' && steps.overzetten.outcome == 'success'
        run: |
          set -euo pipefail
          if git diff --quiet -- data/kanaalpost-publiek.md; then
            echo "geen nieuwe rijen — niets vast te leggen"
            exit 0
          fi
          aantal="$(git diff --numstat -- data/kanaalpost-publiek.md | awk '{print $1}')"
          git config user.name  'doorstroom'
          git config user.email 'doorstroom@users.noreply.github.com'
          git add data/kanaalpost-publiek.md
          git commit -m "doorstroom: ${aantal} spiegelrij(en) overgezet"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "vastgelegd en gepusht: ${aantal} rij(en)"

      # HET ALARM STAAT BUITEN DE KETEN DIE HET BEWAAKT.
      #
      # Dat is punt 4 van de opdracht, en het is geen theorie: op 26-07 om 19:39 meldde de waarnemer
      # "pagina toont oude data" — die melding landde in de vastzittende spiegel en was dus precies zo
      # onzichtbaar als de storing zelf. Een alarm dat door het zieke orgaan loopt, is geen alarm.
      #
      # Twee routes, allebei onafhankelijk van de spiegel én van de Pages-bouw:
      #  1. de run wordt ROOD — GitHub mailt de eigenaar over een gefaalde workflow;
      #  2. één openstaand issue in deze repo, dat bij herstel vanzelf weer dicht gaat.
      # Deze repo is PUBLIEK, dus in het issue staan alleen tellingen en redencodes uit de vastgelegde
      # lijst — nooit de inhoud van een rij, nooit een naam die niet al in deze repo staat.
      #
      # HERHAAL-DREMPEL (order ALARM-DAT-ELKE-RUN-MAILT, 28-07-2026, Richard): route 1 hierboven
      # mailde bij ÉLKE ROOD-run, ook als de oorzaak al twintig keer eerder gemeld was. Een alarm dat
      # bij elke herhaling mailt wordt weggeklikt, en dan mist de ontvanger de mail die wél over iets
      # nieuws gaat. `scripts/lib/alarm-drempel.mjs` (zelfde ontdubbelpatroon als `waarnemer.mjs`'s
      # `magAppenden`, hier op issue-comments toegepast) beslist of de HUIDIGE oorzaakcode al binnen
      # het herhaalvenster (12 uur) gemeld is. Zo ja: geen nieuwe comment, geen `exit 1` — dus geen
      # mail — maar wél zichtbaar als `::warning` in de run-log, en het bestaande issue blijft open.
      # Zo nee (nieuwe oorzaak, of dezelfde oorzaak na afloop van het venster): ongewijzigd gedrag,
      # comment/issue + `exit 1`. Op GROEN blijft het issue-sluiten ongewijzigd — dat gaf al één
      # melding per herstel, dat hoefde niet te veranderen.
      #
      # Codex-bevinding 2 (round-trip): `oorzaakCode`/`alarm-drempel.mjs` saneert nu vluchtige delen
      # (regelnummers, dynamische tellers, vrije tekst na ": ") vóór vergelijking, en vergelijkt per
      # deel-oorzaak i.p.v. de hele kommagescheiden string — anders matcht een aanhoudende structurele
      # fout nooit tegen zichzelf terug, en verdwijnt gedeeltelijk herstel (A+B → A) niet als "al bekend".
      #
      # Codex-bevinding 3 (vertrouwen): dit publieke issue (#40-achtig) is onvergrendeld — elke lezer kan
      # erop reageren. `gh issue view --json body,comments` geeft geen bruikbaar auteursveld (inconsistente
      # `login`-vorm tussen issue en comment in `gh`'s eigen CLI-normalisatie, geverifieerd door beide
      # vormen live op te vragen). Daarom nu `gh api` rechtstreeks tegen de REST-endpoints — die geven wél
      # consistent `login: "github-actions[bot]"` + `type: "Bot"` terug voor zowel het issue als elke
      # comment. `alarm-besluit.mjs` vertrouwt alléén tekst met die exacte auteur, en gebruikt GitHub's
      # eigen `created_at` — nooit een zelf-gerapporteerde `Moment:`-regel uit de tekst zelf, die iedereen
      # kan spoofen. (`gh api --paginate ... --jq 'map(...)'` bleek per pagina te filteren en meerdere
      # JSON-arrays aaneen te plakken i.p.v. ze te mergen — hier vermeden door per item te streamen en
      # buiten `gh api` om met `jq -s` tot één array samen te voegen; live getest tegen een issue met 112
      # comments over 4 pagina's.)
      - name: Alarm buiten de keten
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MERK: 'DOORSTROOM ROOD'
        run: |
          set -euo pipefail

          # Ontbrekend oordeel = de uitvoerder zelf viel om. Dat is rood, niet onbekend.
          if [ ! -f /tmp/oordeel.json ]; then
            uitkomst=ROOD
            samenvatting='uitvoerder gaf geen oordeel af (UITVOERDER_GEFAALD) — zie de stapuitvoer hierboven'
          else
            uitkomst="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/oordeel.json','utf8')).uitkomst")"
            samenvatting="$(node -e '
              const o = JSON.parse(require("fs").readFileSync("/tmp/oordeel.json","utf8"));
              const r = [];
              r.push(`inbox: ${o.bron.ok ? `gelezen, ${o.bron.aangeleverd} rij(en) aangeleverd` : `NIET gelezen (${o.bron.reden})`}${o.bron.map === "ONTBREEKT" ? " — MAP BESTAAT NIET" : ""}`);
              // De kanaalpost hoort in de ALARMTEKST, niet alleen in de stapuitvoer. Zonder deze
              // regel las het alarm "0 rij(en) aangeleverd" terwijl er negentien binnenkwamen langs
              // de andere bron — precies de melding die deze reparatie moest wegnemen. En een
              // weigering zonder telling is een weigering die niemand kan navertellen.
              const k = o.kanaalpost;
              if (k) {
                const telling = Object.entries(k.telling ?? {}).sort((a, b) => b[1] - a[1]).map(([g, n]) => `${g} ${n}`).join(", ");
                r.push(`kanaalpost: ${k.ok ? `${k.gezien} gezien, ${k.bruikbaar} bruikbaar, ${k.geweigerd} geweigerd${telling ? ` (${telling})` : ""}` : `NIET gelezen (${k.reden})`} — ${k.uitkomst}`);
              }
              r.push(`overgezet: ${o.overzetting.overgezet.length}, geweigerd: ${o.overzetting.geweigerd.length + o.bron.onbruikbaar.length}`);
              r.push(`achterstand: ${o.achterstand.uitkomst}${o.achterstand.reden ? ` (${o.achterstand.reden})` : ""}${o.achterstand.oudsteMinuten === null ? "" : `, oudste ${o.achterstand.oudsteMinuten} min`}`);
              r.push(`stempel: ${o.stempel.uitkomst}${o.stempel.reden ? ` (${o.stempel.reden})` : ""}${o.stempel.ouderdomMinuten === null ? "" : `, ${o.stempel.ouderdomMinuten} min oud`}`);
              const b = o.bronRijen ?? { uitkomst: "?", reden: null, gevallen: 0, afgekapt: 0 };
              r.push(`bronrijen: ${b.uitkomst}${b.reden ? ` (${b.reden})` : ""}${b.afgekapt ? `, ${b.afgekapt} ingekort` : ""}`);
              const onbekend = o.vlootstand.filter((v) => v.toestand === "ONBEKEND").map((v) => v.venster);
              r.push(`vloot ONBEKEND (${onbekend.length}): ${onbekend.join(", ") || "geen"}`);
              process.stdout.write(r.join("\n"));
            ')"
          fi

          # Codex-bevinding 1: de JOB-conclusie hangt nu alleen nog af van deze stap (zie
          # `continue-on-error` hierboven). Een eerder-gefaalde stap moet dus HIER alsnog meetellen —
          # anders verdwijnt een echte storing stilletjes zodra `mag=false` (bekende-oorzaak-onderdrukking)
          # toevallig ook van toepassing is op een heel ANDERE, infrastructurele oorzaak.
          infra_oorzaak=""
          if [ "${{ steps.tests.outcome }}" = "failure" ]; then
            infra_oorzaak="tests-gefaald"
          elif [ "${{ steps.overzetten.outcome }}" = "failure" ]; then
            infra_oorzaak="uitvoerder-gefaald"
          elif [ "${{ steps.vastleggen.outcome }}" = "failure" ]; then
            infra_oorzaak="vastleggen-gefaald"
          fi
          if [ -n "$infra_oorzaak" ]; then
            # Dwingt ROOD af ook als /tmp/oordeel.json (geschreven vóór de vastleggen-stap) toevallig
            # GROEN meldde — anders sluit de close-branch hieronder het issue op een oordeel dat de
            # push zelf tegensprak. Dit is de "false GROEN read"-tak uit de Codex-review.
            uitkomst=ROOD
            samenvatting="infra: ${infra_oorzaak} — ${samenvatting}"
          fi

          nummer="$(gh issue list --state open --limit 50 --json number,title \
            --jq "[.[] | select(.title | startswith(\"${MERK}\"))][0].number // empty")"

          if [ "$uitkomst" = "ROOD" ]; then
            nu_iso="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

            issue_json=""
            if [ -n "$nummer" ]; then
              issue_json=/tmp/issue-met-comments.json
              gh api "repos/${GITHUB_REPOSITORY}/issues/${nummer}" \
                --jq '{body, authorLogin: .user.login, authorType: .user.type, createdAt: .created_at}' \
                > /tmp/issue-body.json
              gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${nummer}/comments" \
                --jq '.[] | {body, authorLogin: .user.login, authorType: .user.type, createdAt: .created_at}' \
                | jq -s '.' > /tmp/issue-comments.json
              jq -s '{body: .[0].body, authorLogin: .[0].authorLogin, authorType: .[0].authorType, createdAt: .[0].createdAt, comments: .[1]}' \
                /tmp/issue-body.json /tmp/issue-comments.json > "$issue_json"
            fi

            besluit="$(node scripts/alarm-besluit.mjs /tmp/oordeel.json "$issue_json" "$nu_iso" "$infra_oorzaak")"
            if [ -z "$besluit" ]; then
              echo "::error title=Alarm-besluit leeg::alarm-besluit.mjs gaf geen uitvoer terug" >&2
              exit 1
            fi
            code="$(node -p 'JSON.parse(process.argv[1]).code' "$besluit")"
            mag="$(node -p 'JSON.parse(process.argv[1]).mag' "$besluit")"
            reden="$(node -p 'JSON.parse(process.argv[1]).reden' "$besluit")"
            if [ -z "$code" ] || [ -z "$mag" ]; then
              echo "::error title=Alarm-besluit onvolledig::code of mag ontbreekt in ${besluit}" >&2
              exit 1
            fi

            if [ "$mag" = "false" ]; then
              # Zelfde oorzaak al binnen het herhaalvenster gemeld: geen nieuwe comment, geen
              # exit 1 — dus geen mail. Wél zichtbaar in de run-log; het issue blijft open staan
              # van de eerdere melding.
              echo "::warning title=Doorstroom nog steeds ROOD (bekende oorzaak, geen nieuwe melding)::${code} — ${reden}"
              exit 0
            elif [ "$mag" != "true" ]; then
              # Codex-bevinding (klein): fail-open voorkomen — alles wat geen letterlijk "true" of
              # "false" is, is een fout in het besluit zelf, geen stilzwijgende onderdrukking.
              echo "::error title=Alarm-besluit ongeldige mag-waarde::verwacht 'true' of 'false', kreeg '${mag}'" >&2
              exit 1
            fi

            tekst="$(printf 'Run: %s/%s/actions/runs/%s\nMoment: %s (aanleiding: %s)\n\n%s\noorzaakcode: %s\n' \
              "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}" \
              "$nu_iso" "${GITHUB_EVENT_NAME}" "$samenvatting" "$code")"
            if [ -n "$nummer" ]; then
              gh issue comment "$nummer" --body "$tekst"
              echo "alarm bijgeschreven op issue #${nummer} (oorzaakcode: ${code})"
            else
              nieuw="$(gh issue create --title "${MERK} — de doorstroom of de plaat staat stil" \
                --body "$(printf 'Deze melding staat MET OPZET buiten de publieke spiegel en buiten de Pages-bouw: die twee zijn precies wat hier bewaakt wordt.\n\n%s\n\nDit issue sluit vanzelf zodra een volgende run weer GROEN is.\n' "$tekst")")"
              echo "alarm geopend: ${nieuw} (oorzaakcode: ${code})"
            fi
            echo "::error title=Doorstroom ROOD::${samenvatting}"
            exit 1
          fi

          # Sluiten mag ALLEEN op GROEN. Een oordeel dat GEEL is (niet gemeten, geen telling op de
          # plaat) sloot het alarm eerder gewoon: fail-open, precies de vorm die dit werk bestrijdt.
          if [ "$uitkomst" != "GROEN" ]; then
            echo "::warning title=Doorstroom niet groen::${uitkomst} — ${samenvatting}"
            exit 0
          fi

          if [ -n "$nummer" ]; then
            gh issue close "$nummer" --comment "$(printf 'Weer GROEN.\n\n%s\n' "$samenvatting")"
            echo "alarm gesloten: #${nummer}"
          fi
          echo "GROEN"
